# Local stand-in for the AWS Application Load Balancer.
# Same path rules as the ALB, with two "VMs" (a and b) behind each target group.
#
#   ALB rule                      nginx equivalent
#   priority 10  /api/products*   location /api/products
#   priority 20  /api/inventory*  location /api/inventory
#   default      everything else  location /
#
# Requests alternate between the two backends (round robin), like the ALB spreading
# requests across the registered targets of one target group.
# max_fails/fail_timeout approximate the ALB health check: a backend that refuses
# connections is skipped for 10 seconds.

upstream product_tg {
    server product-a:8081 max_fails=1 fail_timeout=10s;
    server product-b:8081 max_fails=1 fail_timeout=10s;
}

upstream inventory_tg {
    server inventory-a:8082 max_fails=1 fail_timeout=10s;
    server inventory-b:8082 max_fails=1 fail_timeout=10s;
}

upstream ui_tg {
    server ui-a:8080 max_fails=1 fail_timeout=10s;
    server ui-b:8080 max_fails=1 fail_timeout=10s;
}

server {
    listen 8080;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503 http_504;

    location /api/products {
        proxy_pass http://product_tg;
    }

    location /api/inventory {
        proxy_pass http://inventory_tg;
    }

    location / {
        proxy_pass http://ui_tg;
    }
}
